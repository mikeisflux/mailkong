# Box A. One upstream, four hostnames, different exposure for each.
#
# certbot --nginx rewrites these blocks to add TLS. Run it after the HTTP
# blocks are in place and resolving.

upstream mailkong {
    server 127.0.0.1:3000;
    keepalive 32;
}

# The set of addresses allowed to reach the admin console. Keep this in sync
# with ADMIN_IP_ALLOWLIST in .env -- nginx is the outer control, the
# application check is the inner one, and neither is sufficient alone.
geo $admin_allowed {
    default 0;
    # 203.0.113.0/24 1;   # office
    # 198.51.100.7   1;   # home
}

# -- customer dashboard ----------------------------------------------------
server {
    listen 80;
    server_name app.mailkong.net;

    root /opt/mailkong/web/dashboard/dist;
    index index.html;

    # The dashboard is a single-page app: unknown paths are client routes,
    # not 404s.
    location / { try_files $uri /index.html; }

    location /_app/ {
        proxy_pass http://mailkong;
        include /etc/nginx/proxy_params;
    }
}

# -- admin console ---------------------------------------------------------
server {
    listen 80;
    server_name admin.mailkong.net;

    if ($admin_allowed = 0) { return 403; }

    root /opt/mailkong/web/admin/dist;
    index index.html;

    location / { try_files $uri /index.html; }

    location /_admin/ {
        proxy_pass http://mailkong;
        include /etc/nginx/proxy_params;
    }
}

# -- public API ------------------------------------------------------------
server {
    listen 80;
    server_name api.mailkong.net;

    # Attachments. Must not be below the body limit the application sets.
    client_max_body_size 30m;

    location / {
        proxy_pass http://mailkong;
        include /etc/nginx/proxy_params;
    }

    # Stripe signs the exact bytes it sends, so nothing may alter this body.
    location /_stripe/ {
        proxy_pass http://mailkong;
        proxy_request_buffering off;
        include /etc/nginx/proxy_params;
    }
}

# -- marketing site --------------------------------------------------------
server {
    listen 80;
    server_name mailkong.net www.mailkong.net;

    root /opt/mailkong/web/site;
    index index.html;
    location / { try_files $uri $uri.html $uri/ =404; }
}
