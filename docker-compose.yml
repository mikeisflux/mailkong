# Local development datastores only. Production runs Postgres and Redis
# on Box A directly, and Postal on Box B. See docs/infrastructure.md.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mailkong
      POSTGRES_PASSWORD: mailkong
      POSTGRES_DB: mailkong
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailkong"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
